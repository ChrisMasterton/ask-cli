[package]
name = "ask"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
rustyline = "14.0"
libc = "0.2"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
