name: Tests

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Run deterministic tests
        run: cargo test
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
